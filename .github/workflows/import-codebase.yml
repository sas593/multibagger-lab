name: Import Multibagger Lab Codebase

on:
  push:
    branches:
      - codebase-import

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract codebase
        run: |
          mkdir -p /tmp/multibagger
          unzip -q multibagger-lab-complete.zip -d /tmp/multibagger
          cp -a /tmp/multibagger/multibagger-lab/. .

      - name: Remove old files and ZIP
        run: |
          rm -f backend.py index.html
          rm -f multibagger-lab-complete.zip

      - name: Commit extracted codebase
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import Multibagger Lab codebase" || exit 0
          git push
